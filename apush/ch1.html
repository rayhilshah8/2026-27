<script>
const CONCEPTS = [
  // Native America
  {cat:"Native America", q:"Why did Native societies differ so widely across North America?", a:"Geography and available resources shaped different lifeways. <strong>Three-sister farming</strong> (corn, beans, squash) supported dense, sedentary populations in the East &mdash; enough to build a city like <strong>Cahokia</strong>. Poor soil regions like the <strong>Canadian Shield</strong> instead favored small, mobile hunting-and-fishing bands. Complexity ranged from scattered kin-bands to Mississippian mound-building chiefdoms, all before any European contact.", tip:"SAQ angle: Compare the economic and social organization of two Native American societies before 1607."},
  {cat:"Native America", q:"How did humans first reach a continent with no known land bridge to Europe?", a:"During the last Ice Age, lower sea levels exposed a land corridor across the <strong>Bering Strait</strong>, letting migrating peoples walk from Siberia into present-day Alaska, likely following megafauna herds. Over thousands of years their descendants spread across two continents, eventually diversifying into the whole range of societies covered in this chapter &mdash; from small mobile bands to empires like the Aztec and Inca.", tip:"SAQ angle: Explain how migration patterns before 1491 contributed to the diversity of Native American societies."},

  // Age of Exploration
  {cat:"Age of Exploration", q:"What forces launched the European Age of Exploration?", a:"Rising <strong>nation-states</strong> &mdash; Spain unified after Ferdinand of Aragon and Isabella of Castile's 1469 marriage &mdash; gave monarchs the centralized funding and military power to sponsor voyages. <strong>Middlemen</strong> controlling overland Asian trade routes made spices and silk expensive, motivating a search for a direct sea route. The <strong>caravel</strong> made long ocean voyages against the wind possible, and emerging <strong>capitalism</strong> gave investors a financial incentive to fund risky ventures.", tip:"SAQ angle: Explain ONE cause of the European Age of Exploration in the late 15th century."},
  {cat:"Age of Exploration", q:"Did Columbus really \"discover\" something already known?", a:"Norse voyagers led by Leif Erikson reached North America (a place they called Vinland, likely modern Newfoundland) around 1000 CE &mdash; roughly 500 years before Columbus. But that contact was brief, isolated, and left no lasting link between the hemispheres. Columbus's 1492 voyage mattered historically not because it came first, but because it triggered sustained, large-scale exchange between two worlds that had barely known of each other.", tip:"SAQ angle: Explain why the Columbian Exchange, rather than earlier Norse contact, marks the start of sustained interaction between the hemispheres."},
  {cat:"Age of Exploration", q:"Why did Portugal's voyages along the African coast set the template for later colonization?", a:"Starting in the early 1400s, Portuguese expeditions backed by Prince Henry the Navigator sailed down the West African coast, establishing trading posts for gold, ivory, and enslaved people &mdash; decades before Columbus ever sailed. This built a working model that Spain and other powers later transplanted onto the Americas almost unchanged: plantation agriculture, forced labor, and a race-based labor hierarchy.", tip:"SAQ angle: Explain one way Portuguese activity in Africa influenced the later development of European colonies in the Americas."},

  // Conquest
  {cat:"Conquest", q:"How did Cortes and Pizarro conquer massive empires with tiny forces?", a:"Disease devastated populations with no immunity to Old World epidemics. Both <strong>Hernan Cortes</strong> and <strong>Francisco Pizarro</strong> exploited internal divisions &mdash; Cortes allied with rivals of the Aztec, aided by his interpreter <strong>Malinche</strong>, while <strong>Moctezuma's</strong> hesitant response gave the Spanish time to maneuver. Superior military technology sealed the outcome, even after setbacks like the <strong>Noche Triste</strong>, when Aztec forces temporarily drove Cortes's army out of Tenochtitlan.", tip:"SAQ angle: Explain ONE reason Spanish conquistadores were able to defeat large Native American empires."},
  {cat:"Conquest", q:"How did Native peoples resist European control?", a:"Resistance took many forms across two centuries. The <strong>Noche Triste</strong> (1520) saw Aztec forces briefly expel Cortes. The <strong>Battle of Acoma</strong> (1599) ended in brutal Spanish suppression of Pueblo resistance in New Mexico. Eight decades later, <strong>Pope's Rebellion</strong> (1680) succeeded in driving the Spanish out of New Mexico for over a decade &mdash; proof that resistance persisted, and sometimes won, even under sustained colonial pressure.", tip:"SAQ angle: Compare two instances of Native American resistance to European colonization before 1700."},

  // Empire & Exchange
  {cat:"Empire & Exchange", q:"What was the Columbian Exchange, and how did it reorder both hemispheres?", a:"The <strong>Columbian Exchange</strong> moved disease, plants, animals, and people across the Atlantic in both directions. Old World smallpox devastated Native populations; the Old World also brought horses, cattle, and wheat. In return, the New World gave Europe corn, potatoes, and tobacco, fueling population growth abroad. One of the most consequential ecological events in human history.", tip:"SAQ angle: Explain the effects of the Columbian Exchange on ONE region of the world."},
  {cat:"Empire & Exchange", q:"Was Spanish colonization uniquely brutal, or does the \"Black Legend\" oversimplify it?", a:"The <strong>encomienda</strong> system extracted forced labor and tribute from Native peoples under the guise of \"protection\" and conversion. Abuses documented by the priest <strong>Bartolome de Las Casas</strong> fed the <strong>Black Legend</strong> &mdash; a narrative, later amplified by rival powers like England, portraying Spanish rule as exceptionally cruel compared to other European empires, even though most colonizers ran exploitative systems of their own.", tip:"SAQ angle: Explain how and why historical interpretations of Spanish colonization have differed over time."},
  {cat:"Empire & Exchange", q:"Why did England, France, and Spain end up competing for the same territory?", a:"Early explorers staked overlapping claims: <strong>Giovanni Caboto</strong> (John Cabot) sailed for England along the Atlantic coast in 1497; <strong>Robert de La Salle</strong> claimed the Mississippi corridor for France in 1682; Spain held Mexico, the Southwest, and Florida, later extending into California through <strong>Father Junipero Serra's</strong> mission system.", tip:"SAQ angle: Explain ONE cause of imperial rivalry among European powers in North America."},
  {cat:"Empire & Exchange", q:"How did mixed-ancestry populations reshape Spanish colonial society?", a:"Unlike the English colonies, which developed rigid racial separation, Spanish America saw extensive intermarriage between colonizers and Native peoples, producing a <strong>mestizo</strong> population that became central to colonial social structure &mdash; a contrast the course returns to often.", tip:"SAQ angle: Compare Spanish and English approaches to race and social structure in their American colonies."}
];

const VOCAB = [
  // Places & Societies
  {cat:"Places & Societies", term:"Canadian Shield", pos:"noun (proper)", def:"Ancient, mineral-rich rock formation covering much of northeastern North America; its thin, poor soil made large-scale farming difficult.", tip:"Explains why peoples in this region relied on hunting and fishing rather than the farming economies seen further south."},
  {cat:"Places & Societies", term:"Incas", pos:"noun (proper, plural)", def:"Andean empire centered in Peru, known for an extensive road network and centralized administration; conquered by Francisco Pizarro in 1532&ndash;33.", tip:"Comparison material for centralized New World empires alongside the Aztecs."},
  {cat:"Places & Societies", term:"Aztecs", pos:"noun (proper, plural)", def:"Powerful empire centered at Tenochtitlan in central Mexico; conquered by Hernan Cortes in 1519&ndash;21.", tip:"Central case study for how disease, alliances, and technology enabled conquest."},
  {cat:"Places & Societies", term:"Cahokia", pos:"noun (proper, place)", def:"The largest pre-Columbian city north of Mexico (near modern St. Louis), built by Mississippian mound-building culture.", tip:"Evidence of complex, urbanized Native societies existing well before European contact."},
  {cat:"Places & Societies", term:"Mestizos", pos:"noun (plural, Spanish)", def:"People of mixed European and Native American ancestry, common in Spanish America.", tip:"Highlights a key contrast with English colonies, which drew much sharper racial lines."},

  // Concepts & Systems
  {cat:"Concepts & Systems", term:"Nation-states", pos:"noun (plural)", def:"Centralized states unified under a strong monarch, like Spain after Ferdinand and Isabella's marriage.", tip:"Explains why exploration became state-sponsored rather than purely private."},
  {cat:"Concepts & Systems", term:"Three-sister farming", pos:"noun", def:"Growing corn, beans, and squash together, a technique that enriched soil and supported dense, settled populations in eastern North America.", tip:"Key evidence for comparison questions about Native lifeways and social complexity."},
  {cat:"Concepts & Systems", term:"Middlemen", pos:"noun (plural)", def:"Intermediary traders (Italian city-states, Muslim merchants) who controlled land routes into Asia and raised the price of goods reaching Europe.", tip:"A direct cause of Europe's push to find a sea route to Asia."},
  {cat:"Concepts & Systems", term:"Caravel", pos:"noun", def:"A small, maneuverable Portuguese ship with lateen sails that could sail effectively against the wind.", tip:"The technological breakthrough that made transoceanic exploration physically possible."},
  {cat:"Concepts & Systems", term:"Plantation", pos:"noun", def:"A large agricultural estate, often worked by enslaved or forced labor; first developed on Atlantic islands before spreading to the Americas.", tip:"The origin point of the slave-labor economic model later central to American colonization."},
  {cat:"Concepts & Systems", term:"Columbian exchange", pos:"noun (proper)", def:"The transfer of plants, animals, disease, and people between the Old World and New World after 1492.", tip:"One of the highest-yield concepts in the whole course &mdash; shows up in comparison and CCOT prompts constantly."},
  {cat:"Concepts & Systems", term:"Encomienda", pos:"noun (Spanish)", def:"A Spanish system granting colonists the right to Native labor and tribute in exchange for \"protection\" and Christianization.", tip:"A de facto forced-labor system &mdash; useful for comparing labor systems across empires."},
  {cat:"Concepts & Systems", term:"Capitalism", pos:"noun", def:"An economic system built around private investment and profit motive, emerging in Europe alongside the Age of Exploration.", tip:"Provided the financial mechanism that funded colonization."},
  {cat:"Concepts & Systems", term:"Black Legend", pos:"noun (proper)", def:"The narrative, fed partly by Las Casas's own writings and later amplified by rival powers, that Spanish colonization was uniquely brutal.", tip:"A historiography angle &mdash; ask whose interests a historical narrative serves."},
  {cat:"Concepts & Systems", term:"Treaty of Tordesillas", pos:"noun (proper)", def:"1494 agreement dividing the New World between Spain and Portugal along a line, without any Native input.", tip:"Set up Spanish dominance over most of the Americas and Portuguese claims to Brazil."},

  // Conflicts
  {cat:"Conflicts", term:"Noche triste", pos:"noun (Spanish)", def:"The \"Sad Night\" of 1520, when Aztec forces drove Cortes's army out of Tenochtitlan with heavy Spanish losses.", tip:"Shows Native resistance was real and costly, even before the eventual Spanish victory."},
  {cat:"Conflicts", term:"Battle of Acoma", pos:"noun (proper)", def:"1599 conflict in which Spanish forces brutally suppressed a Pueblo revolt at Acoma in present-day New Mexico.", tip:"Shows the harsh reprisals Native resistance could provoke on the northern frontier."},
  {cat:"Conflicts", term:"Pope's Rebellion", pos:"noun (proper)", def:"1680 Pueblo uprising that successfully drove the Spanish out of New Mexico for over a decade.", tip:"A rare example of Native resistance that actually succeeded, at least temporarily."},

  // Explorers & Monarchs
  {cat:"Explorers & Monarchs", term:"Ferdinand of Aragon", pos:"noun (proper)", def:"Spanish king whose 1469 marriage to Isabella of Castile unified Spain and later funded Columbus's voyage.", tip:"Key causation figure for Spain's rise as a unified, exploration-funding nation-state."},
  {cat:"Explorers & Monarchs", term:"Isabella of Castile", pos:"noun (proper)", def:"Spanish queen who, with Ferdinand, unified Spain, completed the Reconquista, and sponsored Columbus's 1492 voyage.", tip:"Same causation thread as Ferdinand &mdash; monarchy + unification + funding = exploration."},
  {cat:"Explorers & Monarchs", term:"Christopher Columbus", pos:"noun (proper)", def:"Genoese navigator sponsored by Spain whose 1492 voyage reached the Caribbean, initiating sustained contact between hemispheres.", tip:"The starting point of the Columbian Exchange and centuries of European colonization."},
  {cat:"Explorers & Monarchs", term:"Francisco Coronado", pos:"noun (proper)", def:"Spanish conquistador who explored the American Southwest in the 1540s searching for the mythical golden cities of C&iacute;bola.", tip:"Extended Spanish territorial claims into what is now the southwestern U.S."},
  {cat:"Explorers & Monarchs", term:"Giovanni Caboto", pos:"noun (proper)", def:"Italian navigator (known in English as John Cabot) who explored the North American coast for England in 1497.", tip:"The basis for England's later territorial claims in North America."},
  {cat:"Explorers & Monarchs", term:"Robert de La Salle", pos:"noun (proper)", def:"French explorer who traveled the length of the Mississippi River and claimed the Louisiana territory for France in 1682.", tip:"Basis for French claims to the interior of North America."},
  {cat:"Explorers & Monarchs", term:"Father Junipero Serra", pos:"noun (proper)", def:"Spanish Franciscan priest who established the California mission system in the 18th century.", tip:"Extended Spanish religious and colonial presence into California, decades after this chapter's main events."},

  // Conquest Figures
  {cat:"Conquest Figures", term:"Conquistadores", pos:"noun (plural, Spanish)", def:"Spanish soldier-adventurers who led military expeditions to conquer and claim land in the Americas.", tip:"The agents carrying out Spain's empire-building on the ground."},
  {cat:"Conquest Figures", term:"Francisco Pizarro", pos:"noun (proper)", def:"Spanish conquistador who conquered the Inca Empire in 1532&ndash;33.", tip:"Parallels Cortes's conquest of the Aztecs &mdash; disease and internal division as recurring causes."},
  {cat:"Conquest Figures", term:"Bartolome de Las Casas", pos:"noun (proper)", def:"Spanish priest who documented and criticized the brutality of the encomienda system and advocated for Native rights.", tip:"His writings are the primary source of the Black Legend narrative."},
  {cat:"Conquest Figures", term:"Hernan Cortes", pos:"noun (proper)", def:"Spanish conquistador who conquered the Aztec Empire in 1519&ndash;21 with help from Native allies and Malinche.", tip:"The key case study for how conquest actually worked in practice."},
  {cat:"Conquest Figures", term:"Malinche", pos:"noun (proper)", def:"A Nahua woman who served as Cortes's interpreter and advisor, crucial to Spanish-Native diplomacy during the conquest.", tip:"A contested figure in historical memory &mdash; seen alternately as betrayer or survivor."},
  {cat:"Conquest Figures", term:"Moctezuma", pos:"noun (proper)", def:"Aztec emperor at the time of Cortes's arrival; his ambiguous response gave the Spanish crucial time to maneuver.", tip:"Central figure in explaining why the conquest unfolded the way it did."}
];

initChapterDeck(CONCEPTS, VOCAB);
</script>
